server:
  port: 8081

spring:
  application:
    name: aihub-admin
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/aihub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:aihub}
    password: ${SPRING_DATASOURCE_PASSWORD:aihub}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # 500ms（D1）：admin 里**唯一**的 Redis 消费者是密钥缓存（ApiKeyService），而 resolve 那一跳
      # 的预算是网关 AdminClientConfig.responseTimeout(3s)。原先的 2s 让「读缓存 + 回写缓存」两次
      # 超时叠加就超过 3 秒 —— 网关于是把健康 admin 的回答当传输故障，valid key 变 401。
      # 密钥缓存是可丢的派生数据：超时就回源 MySQL（真相源），比拖着网关的预算更划算。
      timeout: 500ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aihub}
    password: ${SPRING_RABBITMQ_PASSWORD:aihub}
    connection-timeout: 5s
    listener:
      simple:
        # 重试 3 次（指数退避）后 reject；配合业务队列的 x-dead-letter-* 进入 DLQ。
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2
          max-interval: 2s
        # 绝不 requeue：无限 requeue 会把 broker 和日志同时打爆，且掩盖真正的坏消息。
        default-requeue-rejected: false

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: always

aihub:
  # 渠道主密钥（AES-256，只来自环境变量；不落库、不进镜像、不打日志）。生成方法见 .env.example。
  channel:
    master-key: ${AIHUB_CHANNEL_MASTER_KEY:}
  # 开发专用演示数据（两条同模型渠道 + 一条租户级限流策略 + 一条 key 级限流策略）。默认关闭：它是写入路径，
  # 不该在生产启动时自动改数据；真渠道的 base-url / 密钥必须由运维提供。
  # 打开方式见 README / .env.example：AIHUB_DEMO_SEED_ENABLED=true + 主密钥 + 两条渠道的明文密钥。
  demo-seed:
    enabled: ${AIHUB_DEMO_SEED_ENABLED:false}
    model: ${AIHUB_DEMO_SEED_MODEL:demo-model}
    tenant: ${AIHUB_DEMO_SEED_TENANT:demo}
    primary-base-url: ${AIHUB_DEMO_SEED_PRIMARY_BASE_URL:http://host.docker.internal:11434}
    standby-base-url: ${AIHUB_DEMO_SEED_STANDBY_BASE_URL:http://host.docker.internal:11434}
    # 演示渠道的明文密钥：**只来自环境变量，刻意没有默认值**（默认值等于把明文密钥提交进代码库）。
    # 未提供时 seeder 启动失败并给出指引，绝不写一条解不开/空的密文。
    primary-api-key: ${AIHUB_DEMO_SEED_PRIMARY_API_KEY:}
    standby-api-key: ${AIHUB_DEMO_SEED_STANDBY_API_KEY:}
    qps: 20
    burst: 40
    # 决策 7（修订）：key 级策略（覆盖租户级）也要能被端到端演示，因此比租户级更严格。
    key-qps: 5
    key-burst: 10
  internal:
    secret: ${AIHUB_INTERNAL_SECRET:}
  apikey:
    cache-ttl: 5m
  mint-key:
    enabled: ${AIHUB_MINT_KEY_ENABLED:false}
  metering:
    # 分区维护前推的月数：保证「今天 + N 个月」都有专属分区（默认 2，即本月底再加两个月）。
    partition-months-ahead: 2
    # 每天 03:10（与 M4 的 02:00 对账错开，避免同时动表）。
    partition-cron: "0 10 3 * * *"
