server:
  port: 8081

spring:
  application:
    name: aihub-admin
  # 上传原件的 multipart 上限：**必须显式配置**，默认 1MB 会**静默拒绝**稍大的文件
  #（计划 Global Constraints / M5 Task 2）。PDF 等更大体积由 Task 7 一并覆盖在同一上限内。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/aihub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:aihub}
    password: ${SPRING_DATASOURCE_PASSWORD:aihub}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # 500ms（D1）：admin 里**唯一**的 Redis 消费者是密钥缓存（ApiKeyService），而 resolve 那一跳
      # 的预算是网关 AdminClientConfig.responseTimeout(3s)。原先的 2s 让「读缓存 + 回写缓存」两次
      # 超时叠加就超过 3 秒 —— 网关于是把健康 admin 的回答当传输故障，valid key 变 401。
      # 密钥缓存是可丢的派生数据：超时就回源 MySQL（真相源），比拖着网关的预算更划算。
      timeout: 500ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aihub}
    password: ${SPRING_RABBITMQ_PASSWORD:aihub}
    connection-timeout: 5s
    listener:
      simple:
        # 重试 3 次（指数退避）后 reject；配合业务队列的 x-dead-letter-* 进入 DLQ。
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2
          max-interval: 2s
        # 绝不 requeue：无限 requeue 会把 broker 和日志同时打爆，且掩盖真正的坏消息。
        default-requeue-rejected: false

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: always

aihub:
  # 渠道主密钥（AES-256，只来自环境变量；不落库、不进镜像、不打日志）。生成方法见 .env.example。
  channel:
    master-key: ${AIHUB_CHANNEL_MASTER_KEY:}
  # 控制台令牌（D3/D16）。密钥与 TTL 都由 ConsoleAuthFilter（守 /api/**）与 ConsoleTokenService
  # （签发/校验）读取；"是否可用"的判据只有一份（ConsoleTokenService.isSecretUsable）。
  console:
    # 控制台令牌的签名密钥：**只来自环境变量，刻意没有默认值**（空 = 门关着，见 D16）。
    secret: ${AIHUB_CONSOLE_SECRET:}
    token-ttl: 2h
  # 开发专用演示数据（两条同模型渠道 + 一条租户级限流策略 + 一条 key 级限流策略）。默认关闭：它是写入路径，
  # 不该在生产启动时自动改数据；真渠道的 base-url / 密钥必须由运维提供。
  # 打开方式见 README / .env.example：AIHUB_DEMO_SEED_ENABLED=true + 主密钥 + 两条渠道的明文密钥。
  demo-seed:
    enabled: ${AIHUB_DEMO_SEED_ENABLED:false}
    model: ${AIHUB_DEMO_SEED_MODEL:demo-model}
    tenant: ${AIHUB_DEMO_SEED_TENANT:demo}
    primary-base-url: ${AIHUB_DEMO_SEED_PRIMARY_BASE_URL:http://host.docker.internal:11434}
    standby-base-url: ${AIHUB_DEMO_SEED_STANDBY_BASE_URL:http://host.docker.internal:11434}
    # 演示渠道的明文密钥：**只来自环境变量，刻意没有默认值**（默认值等于把明文密钥提交进代码库）。
    # 未提供时 seeder 启动失败并给出指引，绝不写一条解不开/空的密文。
    primary-api-key: ${AIHUB_DEMO_SEED_PRIMARY_API_KEY:}
    standby-api-key: ${AIHUB_DEMO_SEED_STANDBY_API_KEY:}
    qps: 20
    burst: 40
    # 决策 7（修订）：key 级策略（覆盖租户级）也要能被端到端演示，因此比租户级更严格。
    key-qps: 5
    key-burst: 10
  internal:
    secret: ${AIHUB_INTERNAL_SECRET:}
  apikey:
    cache-ttl: 5m
  mint-key:
    enabled: ${AIHUB_MINT_KEY_ENABLED:false}
  metering:
    # 分区维护前推的月数：保证「今天 + N 个月」都有专属分区（默认 2，即本月底再加两个月）。
    partition-months-ahead: 2
    # 每天 03:10（与 M4 的 02:00 对账错开，避免同时动表）。
    partition-cron: "0 10 3 * * *"
  quota:
    # 每日对账任务（Task 15 / D12）：02:00（**UTC**，zone 在 @Scheduled 上显式钉死）按 request_log
    # 重算当天的 billing_daily，并把「周期至今的重算用量」与 Redis 预扣桶比对，只会**报告**偏差、绝不改账。
    # 时刻与 M3 的分区维护 03:10 错开。
    reconcile-cron: "0 0 2 * * *"
    # 偏差判据：|周期至今重算值 − 桶值| / max(周期至今重算值, 1) > 本值才计（默认 1%，等于不算）。
    reconcile-tolerance-ratio: 0.01
  kb:
    # 上传原件的存储根目录（M5 D1）：原件是唯一真相源，Chroma 是可重建的派生数据。
    # 生产（compose）用 AIHUB_KB_STORAGE_ROOT=/app/data/kb（挂卷跨重启存活）；
    # 默认值刻意指向 target/ 下的**可丢弃**目录 —— 集成测试直接用它、且不许用 @TestPropertySource 覆盖
    #（覆盖会改变 Spring 上下文缓存键，fork 出第 8 个上下文，违反 M5 的上下文预算）。
    storage:
      root: ${AIHUB_KB_STORAGE_ROOT:target/kb-storage}
    # 切分窗口（字符数）与相邻段重叠（字符数）。步长 = size - overlap；overlap 必须 < size。
    # 默认值即生产值；集成测试**直接用默认值**（用 @TestPropertySource 覆盖会 fork 第 8 个 Spring 上下文）。
    chunk:
      size-chars: 800
      overlap-chars: 100
    # 每条 kb.embed 消息携带的段数上界（D10）：批次条数 = ceil(chunkCount / batch-size)。
    # 默认值即生产值，测试不许覆盖（同上，覆盖会 fork 上下文）。
    embed:
      batch-size: 10
    # ── 嵌入上游（D6）：OpenAI 兼容的 POST /v1/embeddings。生产由 env 注入；集成测试由
    #    TestContainers.registerInfrastructure（**唯一的共享注册点**）注入宿主进程内的假上游。
    #    空值 = 没配 ⇒ 失败发生在**调用时**而不是启动时，这样没有嵌入需求的上下文照常启动。
    embedding:
      base-url: ${AIHUB_KB_EMBEDDING_BASE_URL:}
      model: ${AIHUB_KB_EMBEDDING_MODEL:kb-embedding}
      # 判据文字与配置项必须是**同一个数**：KbEmbeddingClientTest 断言"配置读到的值 == 文档写的那个值"。
      timeout-seconds: 30
    # ── 向量库（D3）：真 Chroma 的 REST。collection 名与 metadata 形状是**跨仓库契约**（附录 A），
    #    改它们等于对检索侧（另一个仓库的 Python）做破坏性变更。
    chroma:
      base-url: ${AIHUB_KB_CHROMA_BASE_URL:}
      collection: kb_chunks
      timeout-seconds: 30
