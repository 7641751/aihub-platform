<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aihub 管理台</title>
  <link rel="stylesheet" href="/console/console.css">
</head>
<body>
  <header class="topbar">
    <h1>aihub 管理台</h1>
    <button id="logout-btn" type="button" hidden>退出</button>
  </header>

  <main>
    <!-- 登录视图 -->
    <section id="login-view" class="card">
      <h2>登录</h2>
      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">口令</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-actions"><button id="login-submit" type="submit" aria-disabled="false">登录</button></div>
      </form>
      <p id="login-error" class="message error" role="alert"></p>
    </section>

    <!-- 应用视图 -->
    <div id="app-view" hidden>
      <nav class="tabs" aria-label="运营台页面">
        <button id="tab-channels" type="button" aria-controls="channels-panel" aria-pressed="true">渠道</button>
        <button id="tab-keys" type="button" aria-controls="keys-panel" aria-pressed="false">API Key</button>
        <button id="tab-logs" type="button" aria-controls="logs-panel" aria-pressed="false">请求日志</button>
        <button id="tab-usage" type="button" aria-controls="usage-panel" aria-pressed="false">用量</button>
        <span id="session-info" class="muted"></span>
      </nav>

      <!-- 渠道视图：列表、新建与探活 -->
      <section id="channels-panel" class="card">
        <div class="panel-heading">
          <h2 id="channels-heading">渠道</h2>
          <button id="channel-form-toggle" type="button" aria-expanded="false" aria-controls="channel-form" hidden>新建渠道</button>
        </div>
        <form id="channel-form" class="filter-form" autocomplete="off" hidden>
          <div class="field"><label for="channel-name">名称</label><input id="channel-name" required></div>
          <div class="field"><label for="channel-provider">服务商</label><input id="channel-provider" required></div>
          <div class="field"><label for="channel-base-url">服务地址</label><input id="channel-base-url" required></div>
          <div class="field"><label for="channel-api-key">密钥</label><input id="channel-api-key" type="password" required></div>
          <div class="field"><label for="channel-models">模型配置（可选，JSON）</label><input id="channel-models"></div>
          <div class="form-actions">
            <button id="channel-submit" type="submit">保存渠道</button>
            <button id="channel-form-close" type="button">关闭表单</button>
          </div>
          <p id="channel-form-message" class="message form-message" role="status"></p>
        </form>
        <div id="channels-table-scroll" class="table-scroll" tabindex="0" role="region" aria-labelledby="channels-heading">
          <table>
            <thead>
              <tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">服务商</th><th scope="col">服务地址</th><th scope="col">状态</th>
                <th id="channel-actions-heading" scope="col" hidden>操作</th></tr>
            </thead>
            <tbody id="channels-body"></tbody>
          </table>
        </div>
        <p id="channels-message" class="message" role="status"></p>
      </section>

      <!-- Key 视图：列表 + 新建并一次性展示明文 -->
      <section id="keys-panel" class="card" hidden>
        <div class="panel-heading">
          <h2 id="keys-heading">API Key</h2>
          <button id="key-form-toggle" type="button" aria-expanded="false" aria-controls="key-form" hidden>新建 Key</button>
        </div>
        <form id="key-form" class="filter-form" autocomplete="off" hidden>
          <div class="field"><label for="key-name">名称</label><input id="key-name" required></div>
          <div class="field">
            <label for="key-valid-days">有效天数</label>
            <input id="key-valid-days" type="number" min="1" aria-describedby="key-valid-days-hint">
            <small id="key-valid-days-hint" class="field-hint">留空表示不过期</small>
          </div>
          <div class="form-actions">
            <button id="key-submit" type="submit">创建 Key</button>
            <button id="key-form-close" type="button">关闭表单</button>
          </div>
          <p id="key-form-message" class="message form-message" role="status"></p>
        </form>
        <div id="plaintext-box" class="plaintext" tabindex="-1" role="group" aria-labelledby="plaintext-title" hidden>
          <p id="plaintext-title">明文只显示这一次，请立即复制保存，关闭后无法再次获取。</p>
          <code id="plaintext-key"></code>
          <button id="plaintext-close" type="button">关闭明文</button>
        </div>
        <div id="keys-table-scroll" class="table-scroll" tabindex="0" role="region" aria-labelledby="keys-heading">
          <table>
            <thead>
              <tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">状态</th><th scope="col">到期</th></tr>
            </thead>
            <tbody id="keys-body"></tbody>
          </table>
        </div>
        <p id="keys-message" class="message" role="status"></p>
      </section>

      <!-- 日志视图：租户 + 时间范围查询 -->
      <section id="logs-panel" class="card" hidden>
        <h2 id="logs-heading">请求日志</h2>
        <p id="logs-timezone" class="field-hint">浏览器本地时间</p>
        <form id="logs-form" class="filter-form" autocomplete="off">
          <div class="field"><label for="logs-tenant-id">租户 ID</label><input id="logs-tenant-id" required></div>
          <div class="field">
            <label for="logs-from">起始时间</label>
            <input id="logs-from" type="datetime-local" aria-describedby="logs-timezone">
          </div>
          <div class="field">
            <label for="logs-to">结束时间</label>
            <input id="logs-to" type="datetime-local" aria-describedby="logs-timezone">
          </div>
          <div class="form-actions"><button id="logs-submit" type="submit">查询</button></div>
          <p id="logs-message" class="message form-message" role="status"></p>
        </form>
        <div id="logs-table-scroll" class="table-scroll" tabindex="0" role="region" aria-labelledby="logs-heading">
          <table>
            <thead>
              <tr><th scope="col">requestId</th><th scope="col">状态</th><th scope="col">模型</th><th scope="col">创建时间</th></tr>
            </thead>
            <tbody id="logs-body" aria-busy="false"></tbody>
          </table>
        </div>
      </section>

      <!-- 用量视图：只读、无参（= 当前 UTC 周期；租户由服务端从令牌取，R3.2） -->
      <section id="usage-panel" class="card" hidden>
        <div class="panel-heading">
          <h2 id="usage-heading">用量（本周期）</h2>
          <button id="usage-refresh" type="button" aria-disabled="false">刷新</button>
        </div>
        <p id="usage-meta" class="muted"></p>
        <div id="usage-table-scroll" class="table-scroll" tabindex="0" role="region" aria-labelledby="usage-heading">
          <table>
            <thead>
              <tr><th scope="col">维度</th><th scope="col">上限</th><th scope="col">已用</th><th scope="col">剩余</th></tr>
            </thead>
            <tbody id="usage-body"></tbody>
          </table>
        </div>
        <p id="usage-note" class="message" role="status"></p>
        <p id="usage-message" class="message" role="status"></p>
      </section>
    </div>
  </main>

  <script src="/console/console.js"></script>
</body>
</html>
