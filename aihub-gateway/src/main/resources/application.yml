server:
  port: 8080

spring:
  application:
    name: aihub-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aihub}
    password: ${SPRING_RABBITMQ_PASSWORD:aihub}
    connection-timeout: 5s
    # 网关只发布、不声明任何拓扑（唯一声明方是 admin），因此不需要 RabbitAdmin；
    # 关掉它可以避免启动时就建连（broker 没起时不再刷一屏连接异常日志）。
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true

management:
  health:
    # 关掉 rabbit 健康指示器：RabbitMQ 挂了是**已设计的降级状态**（事件落 spool，恢复后定时重投），
    # 不是网关不健康。留着它会让 /healthz 变成 503 DOWN —— 没有 broker 时网关起不来、
    # 编排层还会把正在正常转发的网关重启掉，正好毁掉 spool 兜底的意义。
    rabbit:
      enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: always

aihub:
  upstream:
    base-url: ${AIHUB_UPSTREAM_BASE_URL:http://127.0.0.1:11434}
    api-key: ${AIHUB_UPSTREAM_API_KEY:}
    default-model: ${AIHUB_UPSTREAM_DEFAULT_MODEL:default}
  # 渠道主密钥：**只来自环境变量**，不落库、不进镜像（设计文档 §6.1）。
  # 格式：v1:<base64 32 字节>[,v2:<base64 32 字节>]；轮换期间同时放旧、新两把。
  # 生成方法见 .env.example。
  channel:
    master-key: ${AIHUB_CHANNEL_MASTER_KEY:}
  config:
    local-ttl: 30s
    snapshot-ttl: 10m
    max-local-snapshot-sources: 300
    # 两次回源尝试之间的最小间隔：抑制 admin 快速失败时的重试风暴（尝试一开始就推后窗口）。
    # 5s 与回源等待上限同量级，又比本地 TTL（30s）小一个数量级 —— 恢复后最多 5s 就能重新拿到快照。
    refresh-cooldown: 5s
    # 配置失效订阅（D4）：生产默认**开**。它是「控制面配置 → 数据面生效」的主动失效通道
    # （订阅 aihub:config:invalidate），关掉就退回 M3 的 TTL 收敛（最长 10 分钟）。
    # Task 17 的验收用它做反证：把 AIHUB_CONFIG_INVALIDATE_SUBSCRIPTION 设成 false，
    # 变更应当重新退回「要等 TTL」的行为。
    invalidate-subscription: ${AIHUB_CONFIG_INVALIDATE_SUBSCRIPTION:true}
  # 数据面限流（仅 /v1/**）。默认开：限流是保护上游的手段，不该靠部署时记得打开。
  # 关掉它 = 完全不做判定（过滤器直接放行），桶的本机容量上界仍然保留。
  ratelimit:
    enabled: ${AIHUB_RATELIMIT_ENABLED:true}
    max-local-buckets: 100000
  auth:
    enabled: ${AIHUB_AUTH_ENABLED:true}
    local-cache-ttl: 30s
    key-cache-ttl: 5m
    admin-base-url: ${AIHUB_ADMIN_BASE_URL:http://127.0.0.1:8081}
  internal:
    secret: ${AIHUB_INTERNAL_SECRET:}
  metering:
    enabled: ${AIHUB_METERING_ENABLED:true}
    max-capture-bytes: 1048576
    queue-capacity: 10000
    spool-max-files: 50000
    spool-dir: ${AIHUB_METERING_SPOOL_DIR:data/metering-spool}
    replay-interval-ms: 30000
    confirm-timeout-ms: 5000
    transport-retry-backoff-ms: 5000
  # 数据面配额预扣（仅 /v1/chat/completions 计费）。额度来自**配置快照**（控制面写、数据面读）：
  # 网关不连数据库，也不每请求回源 admin。默认开：配额是保护付费额度的手段，不该靠部署时记得打开。
  quota:
    enabled: ${AIHUB_QUOTA_ENABLED:true}
    # ⚠️ 必须**严格小于** aihub.metering.max-capture-bytes（= 1048576，见上一段）。
    # 为什么：配额这一层为了估算会把请求体**整体**读进内存（峰值 = 整个 body），而计量只捕获响应体的
    # **尾部滑窗**（上限即 max-capture-bytes）。若两者相等或配额更大，配额层的峰值内存就超过计量预算，
    # 且「配额层先失败 ⇒ 计量根本看不到这次请求」这条关系会被翻转。256 KiB（262144）已远超 chat 请求体
    # 的现实量级，同时给配额层留出明确地比计量层更紧的内存上界。
    max-in-memory-bytes: 262144
    # requestId → 预扣关联 的有界存储：短 TTL（一次请求的生命周期量级）+ 条目上界（防无界增长）。
    reservation-ttl: 2m
    max-reservations: 100000
    # Redis 不可用时的兜底：回源 admin 的 POST /internal/quota/reserve（HMAC 内部跳）预扣。
    # 默认 **true**，理由与限流的「降级仍拒绝」正好相反 —— 配额是**记账**：Redis 挂了必须放行（D7），
    # 而兜底是「在放行之外还能在 Redis 故障期间**如实拒绝**超预算的租户」的唯一手段；它绝不改变拒绝语义
    # （兜底说余额不足仍然是 429 insufficient_quota），自己失败时也仍然放行。关掉它 = 回到纯 fail-open，
    # 并且每次判定都不再有任何内部往返（这是唯一需要它的理由：内部跳会把延迟绑到 admin 上）。
    fallback-enabled: ${AIHUB_QUOTA_FALLBACK_ENABLED:true}
