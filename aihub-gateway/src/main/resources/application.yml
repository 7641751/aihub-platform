server:
  port: 8080

spring:
  application:
    name: aihub-gateway

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: always

aihub:
  upstream:
    base-url: ${AIHUB_UPSTREAM_BASE_URL:http://127.0.0.1:11434}
