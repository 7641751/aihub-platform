server:
  port: 8080

spring:
  application:
    name: aihub-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aihub}
    password: ${SPRING_RABBITMQ_PASSWORD:aihub}
    connection-timeout: 5s
    # 网关只发布、不声明任何拓扑（唯一声明方是 admin），因此不需要 RabbitAdmin；
    # 关掉它可以避免启动时就建连（broker 没起时不再刷一屏连接异常日志）。
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true

management:
  health:
    # 关掉 rabbit 健康指示器：RabbitMQ 挂了是**已设计的降级状态**（事件落 spool，恢复后定时重投），
    # 不是网关不健康。留着它会让 /healthz 变成 503 DOWN —— 没有 broker 时网关起不来、
    # 编排层还会把正在正常转发的网关重启掉，正好毁掉 spool 兜底的意义。
    rabbit:
      enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: always

aihub:
  upstream:
    base-url: ${AIHUB_UPSTREAM_BASE_URL:http://127.0.0.1:11434}
    api-key: ${AIHUB_UPSTREAM_API_KEY:}
    default-model: ${AIHUB_UPSTREAM_DEFAULT_MODEL:default}
  # 渠道主密钥：**只来自环境变量**，不落库、不进镜像（设计文档 §6.1）。
  # 格式：v1:<base64 32 字节>[,v2:<base64 32 字节>]；轮换期间同时放旧、新两把。
  # 生成方法见 .env.example。
  channel:
    master-key: ${AIHUB_CHANNEL_MASTER_KEY:}
  config:
    local-ttl: 30s
    snapshot-ttl: 10m
    max-local-snapshot-sources: 300
  auth:
    enabled: ${AIHUB_AUTH_ENABLED:true}
    local-cache-ttl: 30s
    key-cache-ttl: 5m
    admin-base-url: ${AIHUB_ADMIN_BASE_URL:http://127.0.0.1:8081}
  internal:
    secret: ${AIHUB_INTERNAL_SECRET:}
  metering:
    enabled: ${AIHUB_METERING_ENABLED:true}
    max-capture-bytes: 1048576
    queue-capacity: 10000
    spool-max-files: 50000
    spool-dir: ${AIHUB_METERING_SPOOL_DIR:data/metering-spool}
    replay-interval-ms: 30000
    confirm-timeout-ms: 5000
    transport-retry-backoff-ms: 5000
