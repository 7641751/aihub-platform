# 单元测试不需要真 Redis：关掉 Redis 健康指示器，/healthz 因此仍为 UP。
#
# ⚠️ 测试 classpath 上同名的 application.yml 会**整体取代** src/main/resources/application.yml，
# 而不是与它合并。所以主配置里单元测试依赖的键（management 的 /healthz 路径映射、aihub.* 等）
# 必须在这里重复一遍。
# 也别用 `spring.config.import: classpath:application.yml` 想把主配置拉回来：在本模块的测试
# classpath 上这个位置解析到的就是本文件自己，会被当成循环导入直接忽略（实测上下文仍拿不到
# aihub.upstream.base-url，UpstreamProperties 的 @NotBlank 校验失败）。
spring:
  application:
    name: aihub-gateway
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

aihub:
  upstream:
    base-url: http://127.0.0.1:11434
    api-key: ""
    default-model: default
  auth:
    enabled: false
  internal:
    secret: ""
