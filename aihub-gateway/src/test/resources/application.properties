# 测试专用覆盖项，本文件只放测试真的需要改的键。
#
# 关键：它与主配置的**资源名不同**（application.properties vs application.yml），
# Spring Boot 会把两者都加载并合并，而不是谁取代谁 —— 主配置因此真正参与测试。
# 之前那份同名的 src/test/resources/application.yml 会整体取代 src/main/resources/application.yml，
# 主配置（/healthz 路径映射、aihub.* 等）在测试里根本没被读过，一旦漂移也不会有人发现。
# 所以这里**不再复制**主配置的任何键；主配置改了，测试跟着改，不存在第二份副本。
#
# 单元测试不需要真 Redis：关掉 Redis 健康指示器，/healthz 因此仍为 UP。
management.health.redis.enabled=false
