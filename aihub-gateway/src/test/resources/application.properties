# 测试专用覆盖项，本文件只放测试真的需要改的键。
#
# 关键：它与主配置的**资源名不同**（application.properties vs application.yml），
# Spring Boot 会把两者都加载并合并，而不是谁取代谁 —— 主配置因此真正参与测试。
# 之前那份同名的 src/test/resources/application.yml 会整体取代 src/main/resources/application.yml，
# 主配置（/healthz 路径映射、aihub.* 等）在测试里根本没被读过，一旦漂移也不会有人发现。
# 所以这里**不再复制**主配置的任何键；主配置改了，测试跟着改，不存在第二份副本。
#
# 单元测试不需要真 Redis：关掉 Redis 健康指示器，/healthz 因此仍为 UP。
management.health.redis.enabled=false

# 计量默认关闭：绝大多数网关测试只关心转发与鉴权，不希望牵扯 MQ / spool / 定时任务。
# 需要计量事件的测试用 @DynamicPropertySource / properties 显式打开它
# （RelayMeteringFlowTest、UnreachableUpstreamTest）。
aihub.metering.enabled=false

# 限流默认关闭：理由与上面那条完全相同 —— 绝大多数网关测试只关心转发与鉴权，不希望每个请求都先撞一次
# 「Redis 指向不存在端口」的超时。需要限流的测试用 properties / @DynamicPropertySource 显式打开它
# （RateLimitWiringTest 就是端到端打开它的那一类；RateLimitFilterTest 直接构造过滤器，不经过这条配置）。
aihub.ratelimit.enabled=false
