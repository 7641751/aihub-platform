# 本地开发编排（development-only）：默认口令、无 TLS、Redis 无密码，
# 仅供本机跑通链路；生产部署的加固项见 README「已知边界」。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: aihub
      MYSQL_USER: aihub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # 仅供**本地开发**：这里的 Redis 没有密码（requirepass 需要同时改两个服务的配置，
  # 属**未来里程碑**的生产加固项 —— M3 已收口且没有做，见 README「已知边界」），
  # 而且它是**鉴权的信任源** —— 网关把缓存命中当作权威结果，
  # 能写入 aihub:apikey:<sha256> 的人就能伪造任意 API Key（见 README「已知边界」）。
  # 因此宿主映射收紧到 127.0.0.1：只有本机能连（IDE 等本机客户端仍走 6380）。
  # 容器之间不受影响，仍用服务名 redis:6379。
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aihub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # M5（D3）：向量库。**真 Chroma**，镜像与测试里那个 GenericContainer 用**同一个 tag**（
  # docker.m.daocloud.io 代理仓库 —— Docker Hub 直连在本机不通）。
  # 刻意**不挂卷**：向量是**可重建的派生数据**（原件才是唯一真相源），挂卷只会掩盖"能不能重建"这件事。
  chroma:
    image: docker.m.daocloud.io/chromadb/chroma:0.5.23
    ports:
      - "8000:8000"

  admin:
    build:
      context: .
      dockerfile: aihub-admin/aihub-web/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # M5：**故意不用 service_healthy** —— chroma 镜像里有没有 curl/wget/python 没实测过，
      # 编一个 healthcheck 一旦写错就会让 service_healthy 永远不满足 ⇒ admin 永远不启动。
      # 用 service_started，chroma 的就绪是异步的（客户端调用时自己重试）。
      chroma:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aihub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: aihub
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-aihub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      AIHUB_INTERNAL_SECRET: ${AIHUB_INTERNAL_SECRET:?set AIHUB_INTERNAL_SECRET in .env}
      AIHUB_CHANNEL_MASTER_KEY: ${AIHUB_CHANNEL_MASTER_KEY:?set AIHUB_CHANNEL_MASTER_KEY in .env}
      # M4：控制台会话密钥（签发 / 校验控制台令牌）。缺省会让 /api/** 一律 401（fail-closed，见 ConsoleAuthFilter）。
      # 轮换它会让**已签发的令牌立刻失效**（没有宽限期）。
      AIHUB_CONSOLE_SECRET: ${AIHUB_CONSOLE_SECRET:?set AIHUB_CONSOLE_SECRET in .env}
      # 开发演示数据 seeder：默认关闭。打开前必须先配主密钥与两条渠道的明文密钥（否则启动即失败）。
      AIHUB_DEMO_SEED_ENABLED: ${AIHUB_DEMO_SEED_ENABLED:-false}
      AIHUB_DEMO_SEED_PRIMARY_API_KEY: ${AIHUB_DEMO_SEED_PRIMARY_API_KEY:-}
      AIHUB_DEMO_SEED_STANDBY_API_KEY: ${AIHUB_DEMO_SEED_STANDBY_API_KEY:-}
      # ── M5：KB 流水线（compose 的 `environment:` 是**显式白名单** —— 没列进来的变量在容器里是空的，
      #    这是 M4 Task 17 用一次验收失败换来的）──
      # 原件存储根：**挂卷**，跨重启存活（原件是唯一真相源；Chroma 只是可重建的派生数据）。
      AIHUB_KB_STORAGE_ROOT: /app/data/kb
      # embeddings 上游（OpenAI 兼容 /v1/embeddings）。**默认空** ⇒ 调用时响亮失败 ⇒ 流水线走
      # FAILED + 清理 + DLQ —— 那正是离线 compose 上能验的那一档；要验 READY 必须给一个**真实上游**。
      AIHUB_KB_EMBEDDING_BASE_URL: ${AIHUB_KB_EMBEDDING_BASE_URL:-}
      # ⚠️ base-url **不许带尾部 /v1**（客户端会自己拼 `/v1/embeddings`）；模型名必须与上游一致。
      AIHUB_KB_EMBEDDING_MODEL: ${AIHUB_KB_EMBEDDING_MODEL:-kb-embedding}
      AIHUB_KB_CHROMA_BASE_URL: ${AIHUB_KB_CHROMA_BASE_URL:-http://chroma:8000}
    volumes:
      - admin-files:/app/data/kb
    ports:
      - "8081:8081"

  gateway:
    build:
      context: .
      dockerfile: aihub-gateway/Dockerfile
    depends_on:
      admin:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      AIHUB_UPSTREAM_BASE_URL: ${AIHUB_UPSTREAM_BASE_URL:-http://host.docker.internal:11434}
      SPRING_DATA_REDIS_HOST: redis
      AIHUB_ADMIN_BASE_URL: http://admin:8081
      AIHUB_INTERNAL_SECRET: ${AIHUB_INTERNAL_SECRET:?set AIHUB_INTERNAL_SECRET in .env}
      AIHUB_CHANNEL_MASTER_KEY: ${AIHUB_CHANNEL_MASTER_KEY:?set AIHUB_CHANNEL_MASTER_KEY in .env}
      # M4：是否订阅 admin 的「配置失效」广播（Pub/Sub）。true = 控制面改配置后数据面**秒级**可见；
      # false = 退回「等本地 Caffeine TTL 过期」的旧行为（M3 实测 101 秒）。默认 true。
      AIHUB_CONFIG_INVALIDATE_SUBSCRIPTION: ${AIHUB_CONFIG_INVALIDATE_SUBSCRIPTION:-true}
      AIHUB_UPSTREAM_API_KEY: ${AIHUB_UPSTREAM_API_KEY:-}
      AIHUB_UPSTREAM_DEFAULT_MODEL: ${AIHUB_UPSTREAM_DEFAULT_MODEL:-default}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-aihub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      AIHUB_METERING_SPOOL_DIR: /app/data/metering-spool
    volumes:
      - gateway-spool:/app/data
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  gateway-spool:
  # M5：KB 原件（**必须跨重启存活** —— 它是唯一真相源；Chroma 可以从原件重建，反过来不行）。
  admin-files:
